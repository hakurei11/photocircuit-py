[project]
name = "photocircuit-py"
version = "0.1.0"
description = "Photograph a hand-drawn circuit schematic, get CircuiTikZ code (Python port of PhotoCircuit)"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.7",
    "numpy>=1.24",
    "ai-edge-litert>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
photocircuit = "photocircuit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
